services:

  postgres-test:
    image: postgres:17-alpine
    container_name: tour-postgres-test
    environment:
      POSTGRES_DB: tour_test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    # tmpfs вместо volume — данные не переживают перезапуск, тесты всегда чистые
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tour_test_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis-test:
    image: redis:7-alpine
    container_name: tour-redis-test
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: tour-test-runner
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      SERVICE_NAME: tour-service
      PORT: "8002"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres-test:5432/tour_test_db
      REDIS_URL: redis://redis-test:6379
      # auth-service в тестовой сети не поднимается — тесты должны мокировать JwksClient
      AUTH_SERVICE_JWKS_URL: http://localhost:8000/.well-known/jwks.json
      JWKS_CACHE_TTL_SECONDS: "3600"
      JWT_ALGORITHM: ES256
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "10"
      DB_ECHO: "false"
      TOUR_CACHE_TTL_SECONDS: "60"
      KAFKA_BOOTSTRAP_SERVERS: '["localhost:9092"]'
      KAFKA_TOUR_UPDATES_TOPIC: tour_updated
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000"]'
      CORS_ALLOW_CREDENTIALS: "true"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    command: sh -c "alembic upgrade head && pytest -v --cov=app --cov-report=term-missing"
