services:

  # ---------------------------------------------------------------------------
  # Infrastructure: PostgreSQL (одна БД на сервис — Database per Service)
  # ---------------------------------------------------------------------------

  auth-postgres:
    image: postgres:17-alpine
    container_name: auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  client-postgres:
    image: postgres:17-alpine
    container_name: client-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: client_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - client_postgres_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d client_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  tour-postgres:
    image: postgres:17-alpine
    container_name: tour-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tour_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - tour_postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tour_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sales-postgres:
    image: postgres:17-alpine
    container_name: sales-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sales_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - sales_postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Infrastructure: Redis (отдельный инстанс на сервис для изоляции данных)
  # ---------------------------------------------------------------------------

  auth-redis:
    image: redis:7-alpine
    container_name: auth-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - auth_redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  client-redis:
    image: redis:7-alpine
    container_name: client-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - client_redis_data:/data
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  tour-redis:
    image: redis:7-alpine
    container_name: tour-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - tour_redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Infrastructure: Kafka (один брокер — общий для sales-service и client-service)
  # ---------------------------------------------------------------------------

  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/bitnami/kafka
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Services
  # ---------------------------------------------------------------------------

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    env_file:
      - ./services/auth-service/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@auth-postgres:5432/auth_db
      REDIS_URL: redis://auth-redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./services/auth-service/private.pem:/app/private.pem:ro
      - ./services/auth-service/public.pem:/app/public.pem:ro
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-redis:
        condition: service_healthy

  client-service:
    build:
      context: ./services/client-service
      dockerfile: Dockerfile
    container_name: client-service
    restart: unless-stopped
    env_file:
      - ./services/client-service/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@client-postgres:5432/client_db
      REDIS_URL: redis://client-redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: '["kafka:9092"]'
      AUTH_SERVICE_JWKS_URL: http://auth-service:8000/.well-known/jwks.json
    ports:
      - "8001:8001"
    depends_on:
      client-postgres:
        condition: service_healthy
      client-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  tour-service:
    build:
      context: ./services/tour-service
      dockerfile: Dockerfile
      target: runtime
    container_name: tour-service
    restart: unless-stopped
    env_file:
      - ./services/tour-service/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@tour-postgres:5432/tour_db
      REDIS_URL: redis://tour-redis:6379/0
      AUTH_SERVICE_JWKS_URL: http://auth-service:8000/.well-known/jwks.json
    ports:
      - "8002:8002"
    depends_on:
      tour-postgres:
        condition: service_healthy
      tour-redis:
        condition: service_healthy

  sales-service:
    build:
      context: ./services/sales-service
      dockerfile: Dockerfile
    container_name: sales-service
    restart: unless-stopped
    env_file:
      - ./services/sales-service/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@sales-postgres:5432/sales_db
      KAFKA_BOOTSTRAP_SERVERS: '["kafka:9092"]'
      AUTH_SERVICE_JWKS_URL: http://auth-service:8000/.well-known/jwks.json
      CLIENT_SERVICE_URL: http://client-service:8001
    ports:
      - "8003:8003"
    depends_on:
      sales-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  auth_postgres_data:
  client_postgres_data:
  tour_postgres_data:
  sales_postgres_data:
  auth_redis_data:
  client_redis_data:
  tour_redis_data:
  kafka_data:

networks:
  default:
    name: travel-net
